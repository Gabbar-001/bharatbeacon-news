name: BharatBeacon 15-Minute YouTube Broadcast

on:
  schedule:
    # Runs every 15 minutes (:00, :15, :30, :45 of every hour)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  broadcast:
    name: Generate & Publish 15-Minute News Videos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure YouTube API Credentials
        run: |
          echo "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          echo "$YOUTUBE_TOKEN_JSON" > token.json
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Execute Hourly Broadcast Pipeline
        run: |
          python run_hourly.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload Broadcast Metadata & Run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-logs-${{ github.run_id }}
          path: |
            output/metadata/
            output/logs/
          if-no-files-found: ignore
